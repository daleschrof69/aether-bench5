<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'" />
    <title>Aether Repair Tool</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #00FF41;
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      .logo { width: 56px; height: 56px; opacity: 0.9; }
      h1 {
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-weight: 600;
        margin: 0;
      }
      p {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        margin: 0;
      }
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid rgba(0,255,65,0.18);
        border-top-color: #00FF41;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      a { color: #00FF41; text-decoration: none; border-bottom: 1px dotted #00FF4180; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <h1>Aether Repair Tool</h1>
      <p id="msg" role="status">Starting your repair bench&hellip;</p>
      <p>Your workspace is stored on this computer.</p>
    </div>
    <script>
      if (window.aetherStartupError) {
        document.getElementById('msg').textContent = window.aetherStartupError;
        document.getElementById('spinner').hidden = true;
      }
    </script>
  </body>
</html>
