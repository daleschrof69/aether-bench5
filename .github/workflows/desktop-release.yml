name: Build Aether Windows Desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            aether-cli -> target
            aether-desktop/src-tauri -> target
      - name: Prepare build dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack yarn --cwd frontend install --frozen-lockfile
          corepack yarn --cwd aether-desktop install --frozen-lockfile
          python -m pip install -r backend/requirements.txt -r aether-desktop/requirements-build.txt
      - name: Install native USB build dependency
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify SQLite and desktop access controls
        working-directory: backend
        run: python -m unittest discover -s tests -p test_desktop_runtime.py
      - name: Build Windows installers and bundled services
        working-directory: aether-desktop
        run: corepack yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: aether-windows-desktop
          path: |
            aether-desktop/src-tauri/target/release/bundle/msi/*.msi
            aether-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
